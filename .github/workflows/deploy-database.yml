name: Deploy production database schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production to apply pending migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-schema
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Validate deployment request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$CONFIRMATION" != "deploy-production" ]; then
            echo "Confirmation must be exactly: deploy-production"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Production migrations must run from the default branch: $DEFAULT_BRANCH"
            exit 1
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "The production environment secret DATABASE_URL is not configured."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --linker=hoisted

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:deploy

      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:status
