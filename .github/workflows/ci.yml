name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run --filter=@lumina/i18n compile
      - run: vp check
      - run: vp run test:all
      - run: vp run build:all
