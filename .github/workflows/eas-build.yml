name: Android EAS Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Android EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

jobs:
  build:
    name: Build Android (${{ inputs.target }})
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --linker=hoisted

      - name: Trigger EAS build
        working-directory: apps/mobile
        run: eas build --platform android --profile "${{ inputs.target }}" --non-interactive --no-wait
